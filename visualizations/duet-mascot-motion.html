<div id="duet-mascot-study" class="viz-dotted-background">
  <style>
    #duet-mascot-study {
      display: grid;
      gap: 16px;
      padding: 8px 0;
    }

    #duet-mascot-study .study-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    #duet-mascot-study .study-heading p {
      margin: 4px 0 0;
    }

    #duet-mascot-study .duet-stage {
      --duet-black: #050505;
      --duet-white: #ffffff;
      --duet-mist: rgba(255, 255, 255, 0.2);
      --duet-glass: rgba(255, 255, 255, 0.13);
      position: relative;
      min-height: 330px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 48%, rgba(255, 255, 255, 0.09), transparent 38%),
        var(--duet-black);
      color: var(--duet-white);
    }

    #duet-mascot-study .duet-stage::before {
      position: absolute;
      width: 360px;
      height: 190px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      filter: blur(44px);
      content: '';
      animation: duet-breathe 4.8s ease-in-out infinite;
    }

    #duet-mascot-study .duet-face {
      position: relative;
      z-index: 2;
      width: min(420px, 84vw);
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      filter: drop-shadow(0 0 24px rgba(255, 255, 255, 0.14));
    }

    #duet-mascot-study .socket {
      scale: .84;
      position: relative;
      width: 160px;
      height: 76px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.72);
      border-radius: 29px;
      background:
        radial-gradient(circle at 26% 8%, rgba(255, 255, 255, .34), transparent 42%),
        linear-gradient(152deg, rgba(255, 255, 255, .2), rgba(255, 255, 255, .045) 48%, rgba(255, 255, 255, .11)),
        rgba(255, 255, 255, .045);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .88),
        inset 10px 0 24px rgba(255, 255, 255, .035),
        inset 0 -14px 28px rgba(255, 255, 255, .035),
        0 1px 0 rgba(255, 255, 255, .14),
        0 0 28px rgba(255, 255, 255, .12);
      backdrop-filter: blur(22px) saturate(140%);
      transform-origin: center;
      transition:
        width 480ms cubic-bezier(.16, 1, .3, 1),
        height 480ms cubic-bezier(.16, 1, .3, 1),
        border-radius 480ms cubic-bezier(.16, 1, .3, 1),
        transform 480ms cubic-bezier(.16, 1, .3, 1),
        box-shadow 420ms ease;
    }

    #duet-mascot-study .socket::after {
      position: absolute;
      inset: 5px 12px auto;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(rgba(255, 255, 255, 0.23), transparent);
      filter: blur(5px);
      content: '';
      pointer-events: none;
    }

    #duet-mascot-study .socket::before {
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      background:
        radial-gradient(circle at 78% 88%, rgba(255, 255, 255, .1), transparent 36%),
        linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .075) 50%, transparent 68%);
      content: '';
      pointer-events: none;
    }

    #duet-mascot-study .eye {
      position: relative;
      z-index: 1;
      width: 48px;
      height: 10px;
      border-radius: 999px;
      background: var(--duet-white);
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.42);
      transform-origin: center;
      transition:
        width 360ms cubic-bezier(0.16, 1, 0.3, 1),
        height 360ms cubic-bezier(0.16, 1, 0.3, 1),
        border-radius 360ms ease,
        transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    #duet-mascot-study .brow {
      scale: 1.65;
      --brow-shift: 0px;
      --brow-tilt: 0deg;
      position: absolute;
      z-index: 3;
      top: 38px;
      width: 29px;
      height: 9px;
      border-top: 3px solid rgba(255, 255, 255, 1);
      border-radius: 50% 50% 0 0;
      background: transparent;
      box-shadow: 0 0 9px rgba(255, 255, 255, .2);
      opacity: 0;
      transform: translateX(-50%) translateY(4px) scaleX(.82) scaleY(.72);
      transform-origin: center bottom;
      transition:
        opacity 420ms ease,
        width 560ms cubic-bezier(.16, 1, .3, 1),
        height 560ms cubic-bezier(.16, 1, .3, 1),
        transform 560ms cubic-bezier(.16, 1, .3, 1);
    }

    #duet-mascot-study .brow-left {
      left: 28.8%;
    }

    #duet-mascot-study .brow-right {
      left: 71.2%;
    }

    #duet-mascot-study .mouth {
      z-index: 3;
      position: absolute;
      left: 50%;
      bottom: 8px;
      width: 34px;
      height: 24px;
      display: grid;
      place-items: center;
      opacity: .82;
      transform: translateX(-50%) translateY(0) scale(1);
      transform-origin: center;
      transition: opacity 240ms ease, transform 420ms cubic-bezier(.16, 1, .3, 1);
    }

    #duet-mascot-study .mouth-core {
      scale: 1.8;
      width: 18px;
      height: 5px;
      border-radius: 999px;
      background: var(--duet-white);
      box-shadow: 0 0 11px rgba(255, 255, 255, .34);
      transform-origin: center;
      transition:
        width 360ms cubic-bezier(.16, 1, .3, 1),
        height 360ms cubic-bezier(.16, 1, .3, 1),
        border-radius 360ms ease,
        transform 360ms cubic-bezier(.16, 1, .3, 1),
        background 240ms ease,
        box-shadow 240ms ease;
    }

    #duet-mascot-study .particle-field {
      position: absolute;
      z-index: 1;
      inset: 14% 9%;
      opacity: .2;
      filter: saturate(135%);
      pointer-events: none;
      transition: opacity 700ms ease;
    }

    #duet-mascot-study .particle {
      position: absolute;
      width: var(--particle-size, 4px);
      height: var(--particle-size, 4px);
      border-radius: 50%;
      background: var(--particle-color, rgba(255, 255, 255, .68));
      box-shadow: 0 0 13px 1px var(--particle-glow, rgba(255, 255, 255, .44));
      opacity: 0;
      animation: duet-particle-drift var(--particle-speed, 6.8s) ease-in-out var(--particle-delay, 0s) infinite;
      transition: background 700ms ease, box-shadow 700ms ease;
    }

    #duet-mascot-study .particle:nth-child(1) { left: 7%; top: 56%; --particle-delay: -1.1s; }
    #duet-mascot-study .particle:nth-child(2) { left: 18%; top: 18%; --particle-size: 3px; --particle-speed: 8s; --particle-delay: -4.4s; }
    #duet-mascot-study .particle:nth-child(3) { left: 31%; top: 79%; --particle-size: 3px; --particle-delay: -3.2s; }
    #duet-mascot-study .particle:nth-child(4) { left: 44%; top: 10%; --particle-size: 3px; --particle-speed: 7.6s; --particle-delay: -5.5s; }
    #duet-mascot-study .particle:nth-child(5) { left: 57%; top: 83%; --particle-delay: -2.6s; }
    #duet-mascot-study .particle:nth-child(6) { left: 70%; top: 16%; --particle-size: 3px; --particle-speed: 7.9s; --particle-delay: -6.1s; }
    #duet-mascot-study .particle:nth-child(7) { left: 83%; top: 72%; --particle-size: 3px; --particle-delay: -.5s; }
    #duet-mascot-study .particle:nth-child(8) { left: 94%; top: 39%; --particle-speed: 8.4s; --particle-delay: -3.8s; }

    #duet-mascot-study .duet-stage[data-state='opening'] .particle-field { opacity: .42; }
    #duet-mascot-study .duet-stage[data-state='idle'] .particle-field { opacity: .28; }
    #duet-mascot-study .duet-stage[data-state='listening'] .particle-field { opacity: .48; }
    #duet-mascot-study .duet-stage[data-state='thinking'] .particle-field { opacity: .64; }
    #duet-mascot-study .duet-stage[data-state='speaking'] .particle-field { opacity: .56; }
    #duet-mascot-study .duet-stage[data-state='success'] .particle-field { opacity: .78; }
    #duet-mascot-study .duet-stage[data-state='correction'] .particle-field { opacity: .38; }

    #duet-mascot-study .duet-stage[data-state='opening'] .particle:nth-child(odd) {
      --particle-color: rgba(255, 232, 210, .94);
      --particle-glow: rgba(255, 193, 146, .68);
    }

    #duet-mascot-study .duet-stage[data-state='idle'] .particle:nth-child(4n + 2) {
      --particle-color: rgba(232, 218, 255, .9);
      --particle-glow: rgba(202, 173, 244, .58);
    }

    #duet-mascot-study .duet-stage[data-state='listening'] .particle:nth-child(3n),
    #duet-mascot-study .duet-stage[data-state='correction'] .particle:nth-child(3n) {
      --particle-color: rgba(214, 249, 198, .94);
      --particle-glow: rgba(184, 239, 158, .72);
    }

    #duet-mascot-study .duet-stage[data-state='thinking'] .particle:nth-child(odd) {
      --particle-color: rgba(225, 199, 255, .96);
      --particle-glow: rgba(203, 157, 252, .74);
    }

    #duet-mascot-study .duet-stage[data-state='speaking'] .particle:nth-child(3n + 1) {
      --particle-color: rgba(255, 205, 181, .96);
      --particle-glow: rgba(255, 165, 126, .7);
    }

    #duet-mascot-study .duet-stage[data-state='success'] .particle:nth-child(odd) {
      --particle-color: rgba(255, 225, 145, .98);
      --particle-glow: rgba(255, 198, 73, .76);
      animation-name: duet-particle-success;
    }

    #duet-mascot-study .sound-ring {
      position: absolute;
      width: 370px;
      height: 124px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
    }

    #duet-mascot-study .state-label {
      position: absolute;
      bottom: 22px;
      left: 50%;
      color: rgba(255, 255, 255, 0.58);
      font-size: 12px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      transform: translateX(-50%);
    }

    #duet-mascot-study .duet-stage[data-state='opening'] .socket {
      background-image: none;
      background-color: var(--duet-white);
      border-color: var(--duet-white);
    }

    #duet-mascot-study .duet-stage[data-state='opening'] .socket:first-of-type {
      z-index: 1;
      animation: duet-open-left 2.35s cubic-bezier(.22, 1, .36, 1) forwards;
    }

    #duet-mascot-study .duet-stage[data-state='opening'] .socket:nth-of-type(2) {
      z-index: 2;
      animation: duet-open-right 2.35s cubic-bezier(.22, 1, .36, 1) forwards;
    }

    #duet-mascot-study .duet-stage[data-state='opening'] .eye {
      animation: duet-open-eyes 2.35s cubic-bezier(.22, 1, .36, 1) forwards;
    }

    #duet-mascot-study .duet-stage[data-state='opening'] .mouth {
      animation: duet-open-mouth 2.35s cubic-bezier(.22, 1, .36, 1) forwards;
    }

    #duet-mascot-study .duet-stage[data-state='opening'] .socket::before,
    #duet-mascot-study .duet-stage[data-state='opening'] .socket::after {
      animation: duet-open-sheen 2.35s ease forwards;
    }

    #duet-mascot-study .duet-stage[data-state='idle'] .eye {
      animation: duet-idle-blink 5.4s ease-in-out infinite;
    }

    #duet-mascot-study .duet-stage[data-state='idle'] .socket:first-of-type {
      animation: duet-socket-idle-left 5.2s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='idle'] .socket:nth-of-type(2) {
      animation: duet-socket-idle-right 5.2s cubic-bezier(.45, 0, .55, 1) -2.6s infinite;
    }

    #duet-mascot-study .duet-stage[data-state='idle'] .mouth {
      opacity: .82;
      transform: translateX(-50%) translateY(0) scale(1);
      animation: duet-idle-mouth 5.2s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='idle'] .mouth-core {
      width: 23px;
      height: 4px;
      border: 0;
      border-radius: 999px;
      background: var(--duet-white);
      box-shadow: 0 0 10px rgba(255, 255, 255, .28);
    }

    #duet-mascot-study .duet-stage[data-state='listening'] .eye,
    #duet-mascot-study .duet-stage[data-state='thinking'] .eye,
    #duet-mascot-study .duet-stage[data-state='speaking'] .eye {
      width: 20px;
      height: 20px;
      border-radius: 50%;
    }

    #duet-mascot-study .duet-stage[data-state='listening'] .mouth {
      opacity: .82;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    #duet-mascot-study .duet-stage[data-state='listening'] .mouth-core {
      width: 22px;
      height: 9px;
      border: solid var(--duet-white);
      border-width: 2px 2px 3px;
      border-radius: 0 0 999px 999px;
      background: transparent;
      box-shadow: 0 4px 9px rgba(255, 255, 255, .1);
      animation: duet-listen-smile 1.9s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='listening'] .brow {
      opacity: 0.40;
      animation: duet-listen-brow 1.9s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='listening'] .eye {
      animation: duet-listen-nod-eyes 1.9s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='listening'] .socket:first-of-type {
      animation: duet-socket-listen-nod 1.9s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='listening'] .socket:nth-of-type(2) {
      animation: duet-socket-listen-nod 1.9s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='listening'] .sound-ring {
      animation: duet-ring 1.8s ease-out infinite;
    }

    #duet-mascot-study .duet-stage[data-state='thinking'] .eye {
      animation: duet-thinking-look 3.2s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='thinking'] .brow {
      opacity: 0.54;
      animation: duet-thinking-brow 3.2s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='thinking'] .brow-left {
      --brow-shift: -3px;
      --brow-tilt: -3deg;
    }

    #duet-mascot-study .duet-stage[data-state='thinking'] .brow-right {
      --brow-shift: 2px;
      --brow-tilt: 2deg;
    }

    #duet-mascot-study .duet-stage[data-state='thinking'] .socket:first-of-type {
      animation: duet-socket-think-left 3.2s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='thinking'] .socket:nth-of-type(2) {
      animation: duet-socket-think-right 3.2s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='thinking'] .mouth {
      opacity: 0.75;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    #duet-mascot-study .duet-stage[data-state='thinking'] .mouth-core {
      width: 11px;
      height: 11px;
      border: 3px solid var(--duet-white);
      border-radius: 50%;
      background: transparent;
      box-shadow: 0 0 10px rgba(255, 255, 255, .24);
      animation: duet-thought-mouth 2.4s ease-in-out infinite;
    }

    #duet-mascot-study .duet-stage[data-state='speaking'] .eye {
      width: 19px;
      height: 19px;
      animation: duet-speak-eye-natural 3.2s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='speaking'] .socket {
      border-color: rgba(255, 255, 255, .82);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .92),
        inset 10px 0 24px rgba(255, 255, 255, .045),
        inset 0 -14px 28px rgba(255, 255, 255, .045),
        0 1px 0 rgba(255, 255, 255, .16),
        0 0 32px rgba(255, 255, 255, .17);
    }

    #duet-mascot-study .duet-stage[data-state='speaking'] .socket:first-of-type {
      animation: duet-socket-speak-left 2.15s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='speaking'] .socket:nth-of-type(2) {
      animation: duet-socket-speak-right 2.15s cubic-bezier(.45, 0, .55, 1) -90ms infinite;
    }

    #duet-mascot-study .duet-stage[data-state='speaking'] .brow {
      opacity: 0.44;
      animation: duet-speak-brow 2.15s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='speaking'] .brow-left {
      --brow-tilt: -4deg;
    }

    #duet-mascot-study .duet-stage[data-state='speaking'] .brow-right {
      --brow-tilt: 4deg;
    }

    #duet-mascot-study .duet-stage[data-state='speaking'] .mouth {
      bottom: 5px;
      width: 44px;
      height: 30px;
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    #duet-mascot-study .duet-stage[data-state='speaking'] .mouth-core {
      transition-property: width, height, border-radius, transform;
      width: 30px;
      height: 13px;
      border: solid var(--duet-white);
      border-width: 2px 2px 4px;
      border-radius: 0 0 999px 999px;
      background: transparent;
      box-shadow: none;
      transform-origin: center;
      animation: duet-talk-smile 1000ms cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='success'] .eye {
      width: 42px;
      height: 12px;
      border-radius: 999px;
      background: var(--duet-white);
      box-shadow: 0 0 22px rgba(255, 255, 255, .55);
      animation: duet-success-eye 1.5s cubic-bezier(.16, 1, .3, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='success'] .eye-left {
      transform: translateY(-4px) rotate(7deg);
    }

    #duet-mascot-study .duet-stage[data-state='success'] .eye-right {
      transform: translateY(-4px) rotate(-7deg);
    }

    #duet-mascot-study .duet-stage[data-state='success'] .socket:first-of-type {
      animation: duet-socket-success-left 1.5s cubic-bezier(.16, 1, .3, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='success'] .socket:nth-of-type(2) {
      animation: duet-socket-success-right 1.5s cubic-bezier(.16, 1, .3, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='success'] .socket {
      border-width: 3px;
      border-color: rgba(255, 255, 255, .9);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .9),
        inset 0 -10px 22px rgba(255, 255, 255, .055),
        0 0 30px rgba(255, 255, 255, .2);
    }

    #duet-mascot-study .duet-stage[data-state='success'] .mouth {
      opacity: 1;
      transform: translateX(-50%) translateY(-1px) scale(1);
    }

    #duet-mascot-study .duet-stage[data-state='success'] .mouth-core {
      width: 26px;
      height: 12px;
      border: solid var(--duet-white);
      border-width: 2px 2px 4px;
      border-radius: 0 0 999px 999px;
      background: transparent;
      box-shadow: 0 5px 10px rgba(255, 255, 255, .13);
      animation: duet-success-mouth 1.5s cubic-bezier(.16, 1, .3, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='correction'] .socket:first-of-type {
      animation: duet-socket-correction-left 3.8s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='correction'] .socket:nth-of-type(2) {
      animation: duet-socket-correction-right 3.8s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='correction'] .socket {
      border-color: rgba(255, 255, 255, .76);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .88),
        inset 0 -10px 22px rgba(255, 255, 255, .035),
        0 0 24px rgba(255, 255, 255, .13);
    }

    #duet-mascot-study .duet-stage[data-state='correction'] .eye {
      width: 42px;
      height: 9px;
      animation: duet-correction-eyes 3.8s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    #duet-mascot-study .duet-stage[data-state='correction'] .brow {
      opacity: 0.32;
      transform: translateX(-50%) translateY(1px) scaleX(.9) scaleY(.82);
    }

    #duet-mascot-study .duet-stage[data-state='correction'] .mouth {
      opacity: .76;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    #duet-mascot-study .duet-stage[data-state='correction'] .mouth-core {
      width: 21px;
      height: 8px;
      border: solid var(--duet-white);
      border-width: 2px 2px 3px;
      border-radius: 0 0 999px 999px;
      background: transparent;
      box-shadow: 0 4px 9px rgba(255, 255, 255, .1);
    }

    #duet-mascot-study .motion-note {
      min-height: 22px;
      margin: 0;
      text-align: center;
    }

    @keyframes duet-breathe {
      50% { transform: scale(1.1); opacity: 0.62; }
    }

    @keyframes duet-open-left {
      0%, 18% { scale: 1; }
      100% { scale: .84; }
      0%, 18% {
        height: 94px;
        border-radius: 31px;
        background-color: var(--duet-white);
        border-color: var(--duet-white);
        transform: translate(34px, -25px) scaleX(.98);
      }
      52% {
        height: 88px;
        border-radius: 31px;
        background-color: rgba(255, 255, 255, .78);
        border-color: rgba(255, 255, 255, .94);

  <div class="study-heading">

      <i data-lucide="play" aria-hidden="true"></i>
      Play all
    </button>
  </div>

  <div
    id="duet-stage"
    class="duet-stage"
    data-state="opening"
    role="img"
    aria-label="Duet icon morphing into the idle mascot"
  >
    <div class="particle-field" aria-hidden="true">
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
    </div>
    <div class="sound-ring" aria-hidden="true"></div>
    <div class="duet-face" aria-hidden="true">
      <span class="brow brow-left"></span>
      <span class="brow brow-right"></span>
      <div class="socket"><span class="eye eye-left"></span></div>
      <div class="socket"><span class="eye eye-right"></span></div>
      <span class="mouth"><span class="mouth-core"></span></span>
    </div>
    <span id="duet-state-label" class="state-label">Opening</span>
  </div>

  <div class="viz-controls" role="group" aria-label="Mascot activity">
    <button class="btn state-button" type="button" aria-pressed="true" data-state="opening">Replay opening</button>
    <button class="btn state-button" type="button" aria-pressed="false" data-state="idle">Idle</button>
    <button class="btn state-button" type="button" aria-pressed="false" data-state="listening">Listening</button>
    <button class="btn state-button" type="button" aria-pressed="false" data-state="thinking">Thinking</button>
    <button class="btn state-button" type="button" aria-pressed="false" data-state="speaking">Speaking</button>
    <button class="btn state-button" type="button" aria-pressed="false" data-state="success">Success</button>
    <button class="btn state-button" type="button" aria-pressed="false" data-state="correction">Gentle correction</button>
  </div>

  <p id="duet-motion-note" class="motion-note text-muted" aria-live="polite">
    The Duet mark pauses, separates, turns to glass, and gently resolves into the idle face.
  </p>

  <script>
    (() => {
      const root = document.getElementById('duet-mascot-study');
      const stage = document.getElementById('duet-stage');
      const label = document.getElementById('duet-state-label');
      const note = document.getElementById('duet-motion-note');
      const play = document.getElementById('duet-play-all');
      const buttons = Array.from(root.querySelectorAll('.state-button'));
      const states = ['opening', 'idle', 'listening', 'thinking', 'speaking', 'success', 'correction'];
      const notes = {
        opening: 'The Duet mark pauses, separates, turns to glass, and gently resolves into the idle face.',
        idle: 'At rest, each socket drifts independently around calm line-eyes and a flat mouth.',
        listening: 'Both sockets and pupils move together in a small nod with a subtle smile.',
        thinking: 'The pupils glance upward together while the sockets stay balanced and curious.',
        speaking: 'The glass eye housings bounce with Duet’s cadence while a bright talking smile and subtle lifted brows keep it warm and engaged.',
        success: 'Balanced socket outlines rise cleanly with the bright celebratory line-eyes.',
        correction: 'A slow blink and steady smile keep correction peaceful and encouraging.'
      };
      let timer;
      let introTimer;
      let playing = false;
      let index = 0;

      function persist(state) {
        if (!window.openai?.setWidgetState) return;
        window.openai.setWidgetState({ modelContent: { mascotState: state } }).catch(() => {});
      }

      function setState(next, shouldPersist = true) {
        window.clearTimeout(introTimer);
        stage.dataset.state = next;
        label.textContent = next[0].toUpperCase() + next.slice(1);
        note.textContent = notes[next];
        stage.setAttribute('aria-label', `Duet mascot, ${next}`);
        buttons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.state === next)));
        index = states.indexOf(next);
        if (shouldPersist && next !== 'opening') persist(next);
        if (next === 'opening') {
          introTimer = window.setTimeout(() => setState('idle', false), 2450);
        }
      }

      function stop() {
        playing = false;
        window.clearInterval(timer);
        play.setAttribute('aria-pressed', 'false');
        play.innerHTML = '<i data-lucide="play" aria-hidden="true"></i>Play all';
        if (window.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      function start() {
        playing = true;
        play.setAttribute('aria-pressed', 'true');
        play.innerHTML = '<i data-lucide="pause" aria-hidden="true"></i>Pause';
        if (window.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
        timer = window.setInterval(() => setState(states[(index + 1) % states.length], false), 3200);
      }

      buttons.forEach((button) => button.addEventListener('click', () => {
        stop();
        setState(button.dataset.state);
      }));
      play.addEventListener('click', () => playing ? stop() : start());

      setState('opening', false);
    })();
  </script>
