<title>Checkpoint glows · stage two</title>
<!-- Design preview only, never loaded by the app: ways for the refreshed strip to say "a checkpoint is
     here" — noticed at the edge of attention, never pulling it from the line. Served by the home-design
     preview at /@fs/<this folder>/index.html (not as a plain file: the mascot is bundled by the dev server). -->
</head>
<body>
  <div id="root"></div>
  <!-- Served from /@fs/, so Vite doesn't add React's refresh preamble itself. -->
  <script type="module">
    import RefreshRuntime from '/@react-refresh'
    RefreshRuntime.injectIntoGlobalHook(window)
    window.$RefreshReg$ = () => {}
    window.$RefreshSig$ = () => (type) => type
    window.__vite_plugin_react_preamble_installed__ = true
  </script>
  <script type="module" src="./stage2.tsx"></script>
</body>
