<style>
body{margin:0}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em}
.grain-light{background-image:url(grain-light.svg)!important;background-size:160px 160px!important}
.brush{animation:wipe .75s cubic-bezier(.32,.72,0,1) .25s both}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.step-in{animation:step-in .55s cubic-bezier(.32,.72,0,1) both}
@keyframes step-in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.mic{transition:transform .4s cubic-bezier(.32,.72,0,1)}
.mic:hover{transform:scale(1.04)}
.mic:active{transform:scale(.96)}
.soft-btn{transition:background .3s ease}
.soft-btn:hover{background:#ecebe7!important}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.bar-face .pupil{display:block;transform:translate(var(--px,0px),var(--py,0px));transition:transform .35s cubic-bezier(.32,.72,0,1)}
.bar-face .socket i{animation:bar-blink 6.2s ease-in-out infinite}
@keyframes bar-blink{0%,44%,49%,100%{scale:1 1}46.5%{scale:1 .15}}
.bar-btn{transition:background .35s cubic-bezier(.4,0,.2,1),color .35s cubic-bezier(.4,0,.2,1)}
.bar-btn:hover{color:#1b201f}
</style>
