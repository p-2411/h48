<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caption window · C1</title>
<!-- Design preview only, never loaded by the app: round three, the corner tile (C1) refined, with the
     real Duet mascot (components/duet). Served by the home-design preview at /@fs/<this folder>/index.html. -->
<link rel="stylesheet" href="../caption-v2/caption-v2.css">
<link rel="stylesheet" href="./c1.css">
</head>
<body>
  <div id="root"></div>
  <!-- Served from /@fs/, so Vite doesn't add React's refresh preamble itself. -->
  <script type="module">
    import RefreshRuntime from '/@react-refresh'
    RefreshRuntime.injectIntoGlobalHook(window)
    window.$RefreshReg$ = () => {}
    window.$RefreshSig$ = () => (type) => type
    window.__vite_plugin_react_preamble_installed__ = true
  </script>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
