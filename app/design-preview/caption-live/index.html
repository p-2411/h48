<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Caption window · live</title>
<!-- Design preview only: the app's real caption window (Overlay.tsx, overlay.css, the Duet mascot)
     over a mock video frame, with the stand-in main process from duet-merged/real-overlay.tsx.
     Served by the home-design preview at /@fs/<this folder>/index.html. -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121313; font-family: Inter, system-ui, sans-serif; }
  .video {
    position: relative; width: min(1100px, 100vw); aspect-ratio: 16 / 9; overflow: hidden;
    background:
      radial-gradient(40% 55% at 26% 30%, rgba(255, 186, 120, 0.35), transparent 70%),
      radial-gradient(30% 40% at 80% 25%, rgba(110, 170, 200, 0.25), transparent 70%),
      linear-gradient(180deg, #3b3029 0%, #2a2421 55%, #1a1715 100%);
  }
  .video::before { content: ''; position: absolute; left: 24%; top: 14%; width: 16%; height: 60%; border-radius: 48% 48% 10% 10%; background: rgba(20, 16, 14, 0.9); }
  #host { position: absolute; left: 0; right: 0; bottom: 0; height: 460px; }
</style>
</head>
<body>
  <div class="video"><div id="host"></div></div>
  <!-- Served from /@fs/, so Vite doesn't add React's refresh preamble itself. -->
  <script type="module">
    import RefreshRuntime from '/@react-refresh'
    RefreshRuntime.injectIntoGlobalHook(window)
    window.$RefreshReg$ = () => {}
    window.$RefreshSig$ = () => (type) => type
    window.__vite_plugin_react_preamble_installed__ = true
  </script>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
