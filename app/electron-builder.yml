appId: io.useduet.app
productName: Duet
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: Duet
  # The Mac's readers aren't needed on Windows (resources/bin has every OS's).
  files:
    - '!resources/bin/*-macos'
  # Signing (so SmartScreen and Defender trust the installer) reads its secrets from the environment
  # only, never from this file. With a certificate file (OV), set CSC_LINK (its path or base64) and
  # CSC_KEY_PASSWORD; electron-builder then signs the app, the readers in resources/bin and the
  # installer. Without them the build is unsigned. Azure Artifact Signing would instead need a
  # win.azureSignOptions block here (account and profile names) and AZURE_TENANT_ID, AZURE_CLIENT_ID
  # and AZURE_CLIENT_SECRET in the environment: not set up until one is chosen.
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  # The microphone is Duet's only prompt here: Accessibility (reading the captions) has none, and
  # system audio is asked for by the audio reader, with its own wording (native/macos/AudioReader).
  extendInfo:
    NSMicrophoneUsageDescription: Duet listens when you talk to it or say a line back, and only then.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
