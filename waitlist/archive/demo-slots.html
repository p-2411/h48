<!doctype html>
<!-- Archived 2026-10-11: the "Demo coming soon" slots from the Duet waitlist.
     They were replaced by living illustrations while the product is in progress.
     Bring them back (with real recordings inside) once there is something to record.
     The markup expects ../app/styles.css; the slot styles that were removed are below. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Archived demo slots</title>
<link rel="stylesheet" href="../app/styles.css">
<style>
.video-slot,.demo-slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#000;border:1px dashed var(--line-2);border-radius:6px;color:var(--text-3);font-size:13px}
.video-slot{aspect-ratio:16/9}
.demo-slot{aspect-ratio:16/10;margin:12px}
.play{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center}
.play::before{content:"";margin-left:3px;border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent var(--text-3)}
</style>
</head>
<body>
<!-- Hero: the video area inside the youtube.com frame, beside the Duet panel. -->
<div class="video-slot"><span class="play" aria-hidden="true"></span><span>Demo coming soon</span></div>

<!-- Feature rows: live subtitles, guess first, my words. -->
        <figure class="demo-card">
          <div class="demo-frame">
            <div class="terminal-bar"><span class="terminal-lights" aria-hidden="true"><i></i><i></i><i></i></span><span class="terminal-label">Live subtitles</span><span></span></div>
            <div class="demo-slot"><span class="play" aria-hidden="true"></span><span>Demo coming soon</span></div>

            <div class="demo-slot"><span class="play" aria-hidden="true"></span><span>Demo coming soon</span></div>
          </div>
        </figure>

            <div class="terminal-bar"><span class="terminal-lights" aria-hidden="true"><i></i><i></i><i></i></span><span class="terminal-label">My words</span><span></span></div>
            <div class="demo-slot"><span class="play" aria-hidden="true"></span><span>Demo coming soon</span></div>

</html>
