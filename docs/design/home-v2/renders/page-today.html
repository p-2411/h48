<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="duet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>body{margin:0}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.bar-face .pupil{display:block;transform:translate(var(--px,0px),var(--py,0px));transition:transform .35s cubic-bezier(.32,.72,0,1)}
.bar-face .socket i{animation:bar-blink 6.2s ease-in-out infinite}
@keyframes bar-blink{0%,44%,49%,100%{scale:1 1}46.5%{scale:1 .15}}
.bar-btn{transition:background .35s cubic-bezier(.4,0,.2,1),color .35s cubic-bezier(.4,0,.2,1)}
.bar-btn:hover{color:#1b201f}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head><body style="margin:0">
<div class="grain-light" style="width: 1120px; height: 720px; box-sizing: border-box; background: #f2f3f3; color: #1b201f; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

<header style="height: 48px; width: 1120px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 0 12px 0 14px; font-family: Inter, system-ui, sans-serif; color: #1b201f;">
<div style="display: flex; align-items: center;">
<nav aria-label="Places" style="display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: #e9eaea;">

<a href="Tiling.dc.html" class="bar-btn" aria-label="Home" title="Home" aria-current="false" style="border: 0; cursor: pointer; width: 36px; height: 28px; border-radius: 999px; display: grid; place-items: center; text-decoration: none; background: transparent; box-shadow: none; color: #666c6a;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7M6 9.5V19a1 1 0 0 0 1 1h3.5v-5h3v5H17a1 1 0 0 0 1-1V9.5"></path></svg>
</a>
<span style="width: 1px; height: 18px; align-self: center; margin: 0 3px; background: rgba(27,32,31,0.16);" aria-hidden="true"></span>

<a href="Today.dc.html" class="bar-btn" aria-label="Today" title="Today" aria-current="page" style="border: 0; cursor: pointer; width: 36px; height: 28px; border-radius: 999px; display: grid; place-items: center; text-decoration: none; background: #ffffff; box-shadow: 0 1px 2px rgba(27,32,31,0.10), inset 0 0 0 1px rgba(27,32,31,0.06); color: #1b201f;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8z"></path></svg>
</a>


<a href="Watching.dc.html" class="bar-btn" aria-label="Watching" title="Watching" aria-current="false" style="border: 0; cursor: pointer; width: 36px; height: 28px; border-radius: 999px; display: grid; place-items: center; text-decoration: none; background: transparent; box-shadow: none; color: #666c6a;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM10 9v6l5-3z"></path></svg>
</a>


<a href="Words.dc.html" class="bar-btn" aria-label="Your words" title="Your words" aria-current="false" style="border: 0; cursor: pointer; width: 36px; height: 28px; border-radius: 999px; display: grid; place-items: center; text-decoration: none; background: transparent; box-shadow: none; color: #666c6a;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h11a2 2 0 0 1 2 2v9M5 8h11a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z"></path></svg>
</a>


</nav>
</div>
<a href="Duet.dc.html" aria-label="Talk to Duet" title="Talk to Duet" style="position: relative; width: 44px; height: 44px; display: grid; place-items: center; text-decoration: none;">

<span class="bar-face" style="width: 36px; height: 36px; border-radius: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #f7f8f7; box-shadow: inset 0 0 0 1px rgba(27,32,31,0.12), 0 1px 2px rgba(27,32,31,0.06);">
<span style="display: flex; gap: 3px; margin-top: 2px;">
<span class="socket" style="width: 13px; height: 10px; border-radius: 5px; background: #18211f; display: grid; place-items: center;"><i class="pupil" style="width: 5px; height: 2.5px; border-radius: 2px; background: #f7f8f7;"></i></span>
<span class="socket" style="width: 13px; height: 10px; border-radius: 5px; background: #18211f; display: grid; place-items: center;"><i class="pupil" style="width: 5px; height: 2.5px; border-radius: 2px; background: #f7f8f7;"></i></span>
</span>
<span style="display: block; width: 6px; height: 2.5px; border-radius: 0 0 4px 4px; background: #3a4644;"></span>
</span>


</a>
<div style="justify-self: end; display: flex; align-items: center; gap: 6px;">
<button type="button" title="Change language" style="font: inherit; font-size: 13px; border: 0; cursor: pointer; background: none; color: #666c6a; display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border-radius: 8px;">Spanish<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<span style="width: 1px; height: 16px; margin: 0 4px; background: rgba(27,32,31,0.16);" aria-hidden="true"></span>
<span title="12 days in a row" style="display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px 0 7px; border-radius: 999px; background: rgba(240,110,50,0.09); font-size: 13px; color: #666c6a;">
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="bar-flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f0582c"></stop><stop offset="1" stop-color="#f8a43c"></stop></linearGradient></defs><path fill="url(#bar-flame)" d="M12 2.5c.6 3.1-1.1 4.9-2.7 6.6C7.7 10.8 6 12.6 6 15.3A6 6 0 0 0 12 21.5a6 6 0 0 0 6-6.2c0-2.4-1.1-4.3-2.6-5.7.1 1.6-.5 2.9-1.6 3.4.4-3.9-.6-7.4-1.8-10.5z"></path><path fill="#ffe0a0" d="M12.2 13.2c1.6 1.3 2.4 2.6 2.4 3.9A2.6 2.6 0 0 1 12 19.8a2.6 2.6 0 0 1-2.6-2.7c0-1.5 1.1-2.4 2.8-3.9z"></path></svg>
<b style="color: #1b201f;">12</b> days
</span>
<button type="button" aria-label="Dark mode" title="Dark mode" style="border: 0; cursor: pointer; width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; background: none; color: #666c6a;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></button>
<a href="Settings.dc.html" class="bar-btn" aria-label="Settings" title="Settings" aria-current="false" style="border: 0; cursor: pointer; width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; text-decoration: none; background: transparent; box-shadow: none; color: #666c6a;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></a>
</div>
</header>

<main style="flex-grow: 1; min-height: 0; padding: 0 8px 8px;">
<section aria-label="Today" style="height: 100%; box-sizing: border-box; background: #ffffff; border: 1px solid rgba(27,32,31,0.09); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;">
<header style="flex-shrink: 0; display: flex; align-items: center; height: 46px; padding: 0 18px;">
<h1 style="margin: 0; font-size: 13px; font-weight: 600;"><span style="position: relative; display: inline-block; padding-bottom: 4px;">Today<svg class="brush" viewBox="0 0 100 8" preserveAspectRatio="none" style="position: absolute; left: -1px; bottom: -2px; width: calc(100% + 3px); height: 6px;" aria-hidden="true"><path d="M1.2 3.9 C 6 2.6, 18 2.2, 34 2.5 C 52 2.8, 70 2.1, 86 2.4 C 93 2.5, 98.4 2.9, 99.3 3.8 C 99.8 4.6, 98.6 5.5, 95 5.7 C 80 6.2, 64 5.6, 46 6 C 30 6.3, 14 6, 5 5.8 C 2.2 5.7, 0.6 5, 1.2 3.9 Z" fill="#eda82c"></path></svg></span></h1>
</header>
<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column;">

<div class="body" style="font-family: Inter, system-ui, sans-serif; color: var(--ink); background: var(--card);">

<div style="display: flex; align-items: center; gap: 12px; padding: 4px 16px 0;">
<ol class="today-steps" aria-label="Steps" style="list-style: none; margin: 0 auto; padding: 0; display: flex; gap: 6px; flex: 1; justify-content: center; max-width: 420px;">

<li style="display: flex; flex-direction: column; gap: 6px; width: 120px;">
<span style="display: block; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--ink) 40%, var(--track) 40%);"></span>
<span style="font-size: 11px; color: var(--ink); white-space: nowrap;">Say a line back</span>
</li>

<li style="display: flex; flex-direction: column; gap: 6px; width: 120px;">
<span style="display: block; height: 4px; border-radius: 2px; background: var(--track);"></span>
<span style="font-size: 11px; color: var(--faint); white-space: nowrap;">Review 14 cards</span>
</li>

<li style="display: flex; flex-direction: column; gap: 6px; width: 120px;">
<span style="display: block; height: 4px; border-radius: 2px; background: var(--track);"></span>
<span style="font-size: 11px; color: var(--faint); white-space: nowrap;">One challenge</span>
</li>

</ol>

<button type="button" class="soft-btn" style="font: inherit; font-size: 12px; border: 0; cursor: pointer; background: transparent; color: var(--sub); padding: 6px 10px; border-radius: 999px; white-space: nowrap;">Skip</button>

</div>

<div style="flex-grow: 1; min-height: 0; overflow: auto; display: flex; justify-content: center; align-items: center; padding: 12px 24px 24px;">


<div class="step-in" style="width: 100%; max-width: 640px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center;">
<span style="font-size: 12px; color: var(--sub);">From <i>Un día en Madrid</i> · 1:25</span>
<p class="serif today-line" style="margin: 0; font-size: 42px; line-height: 1.2;">I have to <span style="background: linear-gradient(transparent 58%, var(--mark-seen) 58%, var(--mark-seen) 92%, transparent 92%); padding: 0 3px;">madrugar</span> tomorrow.</p>
<p style="margin: -8px 0 0; font-size: 15px; color: var(--sub);">Mañana tengo que madrugar.</p>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 6px;">
<button type="button" class="press" aria-label="Say it back" style="border: 0; cursor: pointer; width: 68px; height: 68px; border-radius: 34px; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; box-shadow: 0 8px 20px rgba(27,32,31,0.18);">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
</button>
<span style="font-size: 13px; color: var(--sub);">Say the Spanish line back</span>
</div>
<button type="button" class="soft-btn" style="font: inherit; font-size: 13px; border: 0; cursor: pointer; background: var(--soft); color: var(--ink); padding: 8px 14px; border-radius: 999px; display: flex; align-items: center; gap: 8px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5zM15.5 8.5a5 5 0 0 1 0 7"></path></svg>Hear it again</button>
</div>








</div>
</div>

</div>
</section>
</main>
</div>
</body></html>
