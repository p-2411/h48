<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watching, the list</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="duet.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="body" style="font-family: Inter, system-ui, sans-serif; color: var(--ink); background: var(--card);">
<div style="display: flex; align-items: center; gap: 12px; padding: 2px 16px 14px;">
<p class="serif watch-lede" style="margin: 0; font-size: 28px; line-height: 1.1;">Pick up where you left off.</p>
<div style="flex-grow: 1;"></div>
<div class="seg" role="group" aria-label="Show" style="display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--seg);">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="2">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.name}}</button>
</sc-for>
</div>
</div>
<div style="flex-grow: 1; min-height: 0; overflow: auto; padding: 0 16px 18px;">
<ul class="arrive" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px 16px;">
<sc-for list="{{videos}}" as="v" hint-placeholder-count="6">
<li>
<a href="#" class="video lift" aria-label="Continue {{v.title}}" style="display: flex; flex-direction: column; gap: 7px; color: inherit; text-decoration: none;">
<span style="position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 12px; background: {{v.bg}}; overflow: hidden;">
<span style="position: absolute; left: 0; right: 0; bottom: 18%; display: flex; justify-content: center;"><span style="font-size: 12px; color: var(--soft2); background: rgba(0,0,0,0.55); padding: 3px 8px; border-radius: 5px; white-space: nowrap;">{{v.before}}<b style="color: {{v.wordColor}}; font-weight: 600;">{{v.word}}</b>{{v.after}}</span></span>
<span class="play" style="position: absolute; inset: 0; display: grid; place-items: center;"><span style="width: 42px; height: 42px; border-radius: 21px; background: rgba(255,255,255,0.92); color: var(--ink); display: grid; place-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span></span>
<span style="position: absolute; left: 0; bottom: 0; height: 3px; width: {{v.progress}}; background: var(--soft2);"></span>
<span style="position: absolute; right: 8px; top: 8px; font-size: 11px; color: var(--soft2); background: rgba(0,0,0,0.45); padding: 2px 6px; border-radius: 4px;">{{v.length}}</span>
</span>
<span style="font-size: 14px; font-weight: 600; line-height: 1.3;">{{v.title}}</span>
<span style="font-size: 12px; color: var(--sub);">{{v.meta}}</span>
<span style="display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px;">
<sc-for list="{{v.words}}" as="w" hint-placeholder-count="2"><span style="color: {{w.color}};">{{w.word}}</span></sc-for>
<sc-if value="{{v.more}}" hint-placeholder-val="{{ false }}"><span style="color: var(--faint);">{{v.more}}</span></sc-if>
</span>
</a>
</li>
</sc-for>
</ul>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { seen: 'var(--w-seen)', known: 'var(--w-known)', say: 'var(--w-say)', use: 'var(--w-use)', on: { seen: '#ffd60a', known: '#ff9f0a', say: '#4da3ff' } };
    const all = [
      { title: 'Cómo hacer tortilla española', meta: 'YouTube · left off at 5:12 · yesterday', length: '12:40', progress: '41%', bg: '#2b302f', before: 'heat the ', word: 'sartén', after: ' first', wordColor: C.on.known, words: [['sartén', C.known], ['cebolla', C.known], ['huevo', C.say]], more: '+1 new', done: false },
      { title: 'Un día en Madrid', meta: 'YouTube · left off at 1:25 · 2 days ago', length: '8:05', progress: '18%', bg: '#33302a', before: 'I have to ', word: 'madrugar', after: '', wordColor: C.on.seen, words: [['madrugar', C.seen], ['vámonos', C.seen]], more: '', done: false },
      { title: 'Despacito (en vivo)', meta: 'YouTube · left off at 0:40 · 3 days ago', length: '4:41', progress: '14%', bg: '#2b2a33', before: '', word: 'despacito', after: ', slowly', wordColor: C.on.say, words: [['despacito', C.say]], more: '', done: false },
      { title: 'Mercado de San Miguel, a walk', meta: 'YouTube · watched · last week', length: '15:02', progress: '100%', bg: '#2f2a2a', before: 'everything is so ', word: 'rico', after: '', wordColor: C.on.known, words: [['rico', C.known], ['probar', C.say], ['puesto', C.seen]], more: '+3', done: true },
      { title: 'Spanish slang you hear on the street', meta: 'YouTube · left off at 9:10 · last week', length: '11:28', progress: '80%', bg: '#2a3030', before: 'that is so ', word: 'guay', after: '', wordColor: C.on.seen, words: [['guay', C.seen], ['vale', C.use]], more: '', done: false },
      { title: 'Paella, the real way', meta: 'YouTube · watched · 2 weeks ago', length: '18:44', progress: '100%', bg: '#33302c', before: 'add the ', word: 'arroz', after: ' now', wordColor: C.on.known, words: [['arroz', C.use], ['sofrito', C.seen]], more: '+5', done: true }
    ].map((v) => ({ ...v, words: v.words.map(([word, color]) => ({ word, color })) }));
    const show = (this.state || {}).show ?? 'all';
    const pill = (on) => `font: inherit; font-size: 12px; border: 0; cursor: pointer; padding: 6px 12px; border-radius: 999px; white-space: nowrap; background: ${on ? 'var(--seg-on)' : 'transparent'}; box-shadow: ${on ? '0 1px 2px rgba(27,32,31,0.10)' : 'none'}; color: ${on ? 'var(--ink)' : 'var(--sub)'};`;
    return {
      videos: show === 'all' ? all : all.filter((v) => !v.done),
      filters: [['all', 'All'], ['going', 'Still watching']].map(([id, name]) => ({ name, pressed: show === id ? 'true' : 'false', style: pill(show === id), pick: () => this.setState({ show: id }) }))
    };
  }
}
</script>
</body>
</html>
