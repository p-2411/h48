<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duet, watching</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="duet.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="grain-light" style="width: 1120px; height: 720px; box-sizing: border-box; background: #f2f3f3; color: #1b201f; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<dc-import name="Bar" active="watching" hint-size="1120px,48px"></dc-import>
<main style="flex-grow: 1; min-height: 0; padding: 0 8px 8px;">
<section aria-label="Watching" style="height: 100%; box-sizing: border-box; background: #ffffff; border: 1px solid rgba(27,32,31,0.09); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;">

</header>
<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column;">
<dc-import name="WatchingBody" hint-size="100%,100%" style="flex-grow: 1; min-height: 0;"></dc-import>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
