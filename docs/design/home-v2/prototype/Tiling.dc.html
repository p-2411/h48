<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duet home, tiling</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="duet.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
.duet-peek{transition:transform .28s cubic-bezier(.22,1,.36,1)}
.duet-peek:hover{transform:translateY(-14px)}
.duet-peek .duet-say{opacity:0;transform:translateY(6px);transition:opacity .25s,transform .22s cubic-bezier(.22,1,.36,1)}
.duet-peek:hover .duet-say{opacity:1;transform:none}
.split-handle .grip{opacity:0;transition:opacity .3s ease}
.menu-in{animation:menu-in .18s cubic-bezier(.22,1,.36,1) both;transform-origin:top left}
@keyframes menu-in{from{opacity:0;transform:scale(.97) translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
.split-handle:hover .grip,.split-handle.active .grip{opacity:1}
[role=menuitem]:hover{background:rgba(127,127,127,.12)!important}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em}
.hand{font-family:Caveat,'Segoe Print',cursive;font-weight:600;line-height:1}
.scribble path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.22,1,.36,1) .4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.grain-light{background-image:url(/_blob/158315f8725139a4609d628b041b8fec)!important;background-size:160px 160px!important}
.grain-dark{background-image:url(/_blob/67532dd238a8598e4e56e125ca2ae49f)!important;background-size:160px 160px!important}

.duet-swap{display:grid;place-items:center}
.duet-swap>*{grid-area:1/1;transition:opacity .35s ease,transform .32s cubic-bezier(.22,1,.36,1)}
.duet-chat .dot{animation:typing 1.2s ease-in-out .2s 2}
.duet-chat .dot:nth-child(3){animation-delay:.35s}
.duet-chat .dot:nth-child(4){animation-delay:.5s}
@keyframes typing{0%,100%{transform:translateY(0)}35%{transform:translateY(-1.2px)}}
.duet-face{transition:transform .28s cubic-bezier(.22,1,.36,1)}
.duet-call:hover .duet-face{transform:translateY(-1px) scale(1.06) rotate(-2deg)}
.duet-call:active .duet-face{transform:scale(.95)}
.duet-face .pupil{display:block;transform:translate(var(--px,0px),var(--py,0px));transition:transform .22s cubic-bezier(.22,1,.36,1)}
.duet-face .socket{display:grid;place-items:center}
.duet-face .socket i{animation:blink 6.2s ease-in-out infinite}
.duet-face.react-open,.duet-face.react-duet,.duet-face.react-happy{animation:face-hop .48s cubic-bezier(.22,1,.36,1)}
.duet-face.react-swap{animation:face-tilt .28s cubic-bezier(.22,1,.36,1)}
.duet-face.react-close .socket i{animation:blink-now .26s ease}
.duet-face.react-duet .socket{animation:widen .32s cubic-bezier(.22,1,.36,1)}
.duet-face.react-happy .socket i{animation:none;width:6px;height:3.5px;background:transparent!important;border:1.6px solid currentColor;border-bottom:0;border-radius:4px 4px 0 0;transform:translateY(.5px)}
.duet-face.react-happy .smile{transform:scaleX(1.5)}
@keyframes face-hop{0%{transform:none}32%{transform:translateY(-3px) scale(1.07)}62%{transform:translateY(.5px) scale(.98)}100%{transform:none}}
@keyframes face-tilt{0%,100%{transform:none}45%{transform:rotate(-7deg)}}
@keyframes blink-now{0%,100%{scale:1 1}45%{scale:1 .1}}
@keyframes widen{0%,100%{transform:none}35%{transform:scale(1.12,1.28)}}
.duet-face .socket-r i{animation-delay:.05s}
.duet-call:hover .smile{transform:scaleX(1.25)}
.duet-face .smile{transition:transform .25s cubic-bezier(.22,1,.36,1)}
@keyframes sock-l{0%,100%{border-radius:5px 6px 5px 6px;transform:translateY(0) rotate(0)}50%{border-radius:6px 5px 6px 5px;transform:translateY(-.4px) rotate(-1.5deg) scaleX(1.03)}}
@keyframes sock-r{0%,100%{border-radius:6px 5px 6px 5px;transform:translateY(-.3px) rotate(1deg)}50%{border-radius:5px 6px 5px 6px;transform:translateY(.4px) rotate(0) scaleX(.98)}}
@keyframes blink{0%,44%,49%,100%{scale:1 1}46.5%{scale:1 .15}}
.lift{transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .45s ease}
.lift:hover{transform:translateY(-2px)}
.chip{transition:transform .32s cubic-bezier(.22,1,.36,1)}
.lift:hover .chip,section:hover .chip{transform:rotate(-8deg) scale(1.08)}
.flame{transform-origin:50% 90%}
.streak:hover .flame{animation:flicker .9s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.08,.96) rotate(-3deg)}60%{transform:scale(.97,1.06) rotate(2deg)}}
.duet-eye i{transition:transform .32s cubic-bezier(.22,1,.36,1),height .25s ease,border-radius .25s ease,background .25s ease,border-color .25s ease}
</style>
</helmet>
<div class="{{grainClass}}" onPointerMove="{{track}}" onPointerLeave="{{untrack}}" style="width: 1120px; height: 720px; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.ground}}; color: {{t.ink}}; transition: background-color 0.5s ease, color 0.5s ease; font-family: Inter, system-ui, sans-serif; display: flex;">

<sc-if value="{{isRail}}" hint-placeholder-val="{{ false }}">
<nav aria-label="Duet" style="width: 76px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 0;">
<button type="button" onClick="{{home}}" aria-label="Home" title="Home" style="border: 0; cursor: pointer; width: 48px; height: 48px; border-radius: 14px; background: {{t.ink}}; display: grid; place-items: center; margin-bottom: 14px;">
<img src="{{t.markOnInk}}" alt="" style="width: 40px; height: 40px;">
</button>
<sc-for list="{{tiles}}" as="tile" hint-placeholder-count="4">
<button type="button" onClick="{{tile.open}}" aria-pressed="{{tile.activeText}}" title="{{tile.hint}}" style="{{tile.railStyle}}">
<span style="width: 40px; height: 32px; border-radius: 12px; display: grid; place-items: center; background: {{tile.railFill}}; color: {{tile.railIcon}};">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tile.icon}}"></path></svg>
</span>
<span style="font-size: 11px; font-weight: 600;">{{tile.name}}</span>
</button>
</sc-for>
<div style="flex-grow: 1;"></div>
<span style="font-size: 12px; font-weight: 700;">12</span>
<span style="font-size: 10px; color: {{t.sub}}; margin-bottom: 8px;">days</span>
<span style="font-size: 11px; font-weight: 700; padding: 5px 8px; border-radius: 8px; background: {{t.fill}};">ES</span>
</nav>
</sc-if>

<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">

<sc-if value="{{hasHeader}}" hint-placeholder-val="{{ true }}">
<header style="height: 48px; flex-shrink: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 0 12px 0 14px;">
<div style="display: flex; align-items: center;">
<sc-if value="{{isTop}}" hint-placeholder-val="{{ true }}">
<nav aria-label="Tiles" style="display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: {{t.fill}};">
<button type="button" onClick="{{home}}" aria-pressed="{{homeActiveText}}" aria-label="Home" title="Home  Ctrl+0" style="{{homeStyle}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7M6 9.5V19a1 1 0 0 0 1 1h3.5v-5h3v5H17a1 1 0 0 0 1-1V9.5"></path></svg>
</button>
<span style="width: 1px; height: 18px; align-self: center; margin: 0 3px; background: {{t.line2}};" aria-hidden="true"></span>
<sc-for list="{{navTiles}}" as="tile" hint-placeholder-count="3">
<button type="button" onClick="{{tile.toggle}}" aria-pressed="{{tile.activeText}}" aria-label="{{tile.name}}" title="{{tile.hint}}" style="{{tile.topStyle}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tile.icon}}"></path></svg>
</button>
</sc-for>
</nav>
</sc-if>
</div>
<button type="button" class="duet-call" onClick="{{duet.toggle}}" aria-pressed="{{duet.activeText}}" aria-label="{{duet.label}}" title="{{duet.label}}  Ctrl+4" style="position: relative; border: 0; cursor: pointer; padding: 0; width: 44px; height: 44px; border-radius: 14px; background: none; display: grid; place-items: center;">
<span class="duet-swap">
<span style="{{duet.faceShow}}"><span class="duet-face {{duet.react}}" style="{{duet.face}}">
<span style="display: flex; gap: 3px; margin-top: 2px;">
<span class="socket socket-l" style="{{duet.socket}}"><i class="pupil" style="{{duet.pupil}}"></i></span>
<span class="socket socket-r" style="{{duet.socket}}"><i class="pupil" style="{{duet.pupil}}"></i></span>
</span>
<span class="smile" style="{{duet.smile}}"></span>
</span></span>
<sc-if value="{{duet.on}}" hint-placeholder-val="{{ false }}">
<svg class="duet-chat" width="38" height="36" viewBox="0 0 38 36" style="{{duet.chatShow}}" aria-hidden="true"><path d="M10 3.5h18a7.5 7.5 0 0 1 7.5 7.5v9a7.5 7.5 0 0 1-7.5 7.5H17l-6.5 5.2v-5.2H10A7.5 7.5 0 0 1 2.5 20v-9A7.5 7.5 0 0 1 10 3.5z" fill="{{duet.chatFill}}" stroke="{{duet.chatEdge}}" stroke-width="1"></path><circle class="dot" cx="12.5" cy="15.5" r="2.3" fill="{{duet.chatInk}}"></circle><circle class="dot" cx="19" cy="15.5" r="2.3" fill="{{duet.chatInk}}"></circle><circle class="dot" cx="25.5" cy="15.5" r="2.3" fill="{{duet.chatInk}}"></circle></svg>
</sc-if>
</span>
<span style="{{duet.ring}}" aria-hidden="true"></span>
<span style="{{duet.dot}}" aria-hidden="true"></span>
</button>
<div style="justify-self: end; display: flex; align-items: center; gap: 6px;">
<button type="button" title="Change language" style="font: inherit; font-size: 13px; border: 0; cursor: pointer; background: none; color: {{t.sub}}; display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border-radius: 8px;">Spanish<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<span style="width: 1px; height: 16px; margin: 0 4px; background: {{t.line2}};" aria-hidden="true"></span>
<span class="streak" title="12 days in a row" style="display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px 0 7px; border-radius: 999px; background: {{t.flameBg}}; font-size: 13px; color: {{t.sub}};">
<svg class="flame" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="duet-flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="{{t.flameA}}"></stop><stop offset="1" stop-color="{{t.flameB}}"></stop></linearGradient></defs><path fill="url(#duet-flame)" d="M12 2.5c.6 3.1-1.1 4.9-2.7 6.6C7.7 10.8 6 12.6 6 15.3A6 6 0 0 0 12 21.5a6 6 0 0 0 6-6.2c0-2.4-1.1-4.3-2.6-5.7.1 1.6-.5 2.9-1.6 3.4.4-3.9-.6-7.4-1.8-10.5z"></path><path fill="{{t.flameCore}}" d="M12.2 13.2c1.6 1.3 2.4 2.6 2.4 3.9A2.6 2.6 0 0 1 12 19.8a2.6 2.6 0 0 1-2.6-2.7c0-1.5 1.1-2.4 2.8-3.9z"></path></svg>
<b style="color: {{t.ink}};">12</b> days
</span>
<button type="button" onClick="{{toggleDark}}" aria-label="{{themeLabel}}" title="{{themeLabel}}" style="border: 0; cursor: pointer; width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; background: none; color: {{t.sub}};">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{themeIcon}}"></path></svg>
</button>
<button type="button" onClick="{{openSettings}}" aria-label="Settings" aria-expanded="{{settingsOpenText}}" title="Settings" style="border: 0; cursor: pointer; padding: 0; width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; background: {{settingsChip}}; color: {{t.sub}};"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>
</div>
</header>
</sc-if>
<sc-if value="{{isRail}}" hint-placeholder-val="{{ false }}"><div style="height: 16px; flex-shrink: 0;"></div></sc-if>

<main style="position: relative; flex-grow: 1; min-height: 0; padding: 0 8px 8px 0; padding-left: {{mainPadLeft}}; padding-bottom: {{areaBottom}}; transition: padding-bottom 0.38s cubic-bezier(0.22, 1, 0.36, 1);">

<div aria-hidden="{{hubHiddenText}}" style="{{hubStyle}}">
<button type="button" class="lift" onClick="{{openToday}}" onMouseEnter="{{lookAt.today}}" style="grid-row: 1 / 3; font: inherit; text-align: left; border: 0; cursor: pointer; border-radius: 16px; {{hub.today}} color: {{t.ink}}; padding: 28px; display: flex; flex-direction: column; gap: 14px;">
<span style="font-size: 13px; font-weight: 600; color: {{hubLabel.today}};"><span style="position: relative; display: inline-block; padding-bottom: 4px;">Today<svg class="brush" viewBox="0 0 100 8" preserveAspectRatio="none" style="display: {{fun.show}}; position: absolute; left: -1px; bottom: -2px; width: calc(100% + 3px); height: 6px;" aria-hidden="true"><path d="M1.2 3.9 C 6 2.6, 18 2.2, 34 2.5 C 52 2.8, 70 2.1, 86 2.4 C 93 2.5, 98.4 2.9, 99.3 3.8 C 99.8 4.6, 98.6 5.5, 95 5.7 C 80 6.2, 64 5.6, 46 6 C 30 6.3, 14 6, 5 5.8 C 2.2 5.7, 0.6 5, 1.2 3.9 Z" fill="{{fun.today.line}}"></path></svg></span></span>
<span class="serif" style="font-size: 38px; line-height: 1.05; margin-top: 2px;">Good afternoon.</span>
<span style="display: flex; flex-direction: column; gap: 6px; margin-top: 20px;">
<span style="font-size: 12px; color: {{t.sub}};">Your word for today</span>
<span class="serif" style="align-self: flex-start; font-size: 64px; line-height: 0.95; color: {{t.ink}}; background: {{wordMark}}; padding: 0 4px; margin-left: -4px;">madrugar</span>
<span style="font-size: 14px; color: {{t.sub}};">to get up early · heard 4 times in <i>Un día en Madrid</i></span>
</span>
<span style="display: flex; flex-direction: column; gap: 6px; margin-top: 24px; width: 100%; max-width: 420px;">
<span style="display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-radius: 12px; background: {{t.fill}};"><span style="width: 24px; height: 24px; border-radius: 8px; background: {{t.ink}}; color: {{t.bg}}; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex-shrink: 0;">1</span><span style="display: flex; flex-direction: column; gap: 1px; min-width: 0;"><span style="font-size: 14px; font-weight: 600;">Say a line back</span><span style="font-size: 12px; color: {{t.sub}};">“I have to madrugar tomorrow”</span></span></span>
<span style="display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-radius: 12px; background: {{t.fill}};"><span style="width: 24px; height: 24px; border-radius: 8px; background: {{t.card}}; color: {{t.ink}}; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex-shrink: 0;">2</span><span style="display: flex; flex-direction: column; gap: 1px; min-width: 0;"><span style="font-size: 14px; font-weight: 600;">Review 14 cards</span><span style="font-size: 12px; color: {{t.sub}};">About three minutes</span></span></span>
<span style="display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-radius: 12px; background: {{t.fill}};"><span style="width: 24px; height: 24px; border-radius: 8px; background: {{t.card}}; color: {{t.ink}}; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex-shrink: 0;">3</span><span style="display: flex; flex-direction: column; gap: 1px; min-width: 0;"><span style="font-size: 14px; font-weight: 600;">One challenge</span><span style="font-size: 12px; color: {{t.sub}};">Use cocina in a sentence with Duet</span></span></span>
</span>
<span style="margin-top: auto; display: flex; align-items: center; gap: 12px;">
<span style="font-size: 14px; font-weight: 600; padding: 12px 20px; border-radius: 999px; background: {{t.ink}}; color: {{t.bg}};">Start</span>
<span style="font-size: 13px; color: {{t.sub}};">About five minutes</span>
</span>
</button>
<button type="button" class="lift" onClick="{{openWatching}}" onMouseEnter="{{lookAt.watching}}" style="font: inherit; text-align: left; border: 0; cursor: pointer; border-radius: 16px; {{hub.watching}} color: {{t.ink}}; padding: 22px; display: flex; flex-direction: column; gap: 12px;">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: {{hubLabel.watching}};"><span style="position: relative; display: inline-block; padding-bottom: 4px;">Watching<svg class="brush" viewBox="0 0 100 8" preserveAspectRatio="none" style="display: {{fun.show}}; position: absolute; left: -1px; bottom: -2px; width: calc(100% + 3px); height: 6px;" aria-hidden="true"><path d="M1.2 3.9 C 6 2.6, 18 2.2, 34 2.5 C 52 2.8, 70 2.1, 86 2.4 C 93 2.5, 98.4 2.9, 99.3 3.8 C 99.8 4.6, 98.6 5.5, 95 5.7 C 80 6.2, 64 5.6, 46 6 C 30 6.3, 14 6, 5 5.8 C 2.2 5.7, 0.6 5, 1.2 3.9 Z" fill="{{fun.watching.line}}"></path></svg></span></span>
<span style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%;">
<span style="display: flex; flex-direction: column; gap: 6px;"><span style="position: relative; display: block; height: 96px; border-radius: 12px; background: #2b302f; overflow: hidden; flex-shrink: 0;"><span style="position: absolute; left: 0; right: 0; bottom: 15px; display: flex; justify-content: center;"><span style="font-size: 11px; line-height: 1.3; color: #f4f4f2; background: rgba(0,0,0,0.55); padding: 2px 6px; border-radius: 4px; white-space: nowrap;">heat the <b style="color: #ff9f0a; font-weight: 600;">sartén</b> first</span></span><span style="position: absolute; left: 0; bottom: 0; height: 2px; width: 41%; background: rgba(255,255,255,0.75);"></span></span><span style="font-size: 13px; font-weight: 600;">Cómo hacer tortilla española</span><span style="font-size: 12px; color: {{t.sub}};">Left off at 5:12 · 4 new words</span></span>
<span style="display: flex; flex-direction: column; gap: 6px;"><span style="position: relative; display: block; height: 96px; border-radius: 12px; background: #33302a; overflow: hidden; flex-shrink: 0;"><span style="position: absolute; left: 0; right: 0; bottom: 15px; display: flex; justify-content: center;"><span style="font-size: 11px; line-height: 1.3; color: #f4f4f2; background: rgba(0,0,0,0.55); padding: 2px 6px; border-radius: 4px; white-space: nowrap;">I have to <b style="color: #ffd60a; font-weight: 600;">madrugar</b></span></span><span style="position: absolute; left: 0; bottom: 0; height: 2px; width: 18%; background: rgba(255,255,255,0.75);"></span></span><span style="font-size: 13px; font-weight: 600;">Un día en Madrid</span><span style="font-size: 12px; color: {{t.sub}};">Left off at 1:25 · 2 new words</span></span>
</span>
</button>
<button type="button" class="lift" onClick="{{openCards}}" onMouseEnter="{{lookAt.cards}}" style="font: inherit; text-align: left; border: 0; cursor: pointer; border-radius: 16px; {{hub.cards}} color: {{t.ink}}; padding: 22px; display: flex; flex-direction: column; gap: 12px;">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: {{hubLabel.cards}};"><span style="position: relative; display: inline-block; padding-bottom: 4px;">Your words<svg class="brush" viewBox="0 0 100 8" preserveAspectRatio="none" style="display: {{fun.show}}; position: absolute; left: -1px; bottom: -2px; width: calc(100% + 3px); height: 6px;" aria-hidden="true"><path d="M1.2 3.9 C 6 2.6, 18 2.2, 34 2.5 C 52 2.8, 70 2.1, 86 2.4 C 93 2.5, 98.4 2.9, 99.3 3.8 C 99.8 4.6, 98.6 5.5, 95 5.7 C 80 6.2, 64 5.6, 46 6 C 30 6.3, 14 6, 5 5.8 C 2.2 5.7, 0.6 5, 1.2 3.9 Z" fill="{{fun.cards.line}}"></path></svg></span></span>
<span style="display: flex; align-items: baseline; gap: 8px;"><span class="serif" style="font-size: 52px; line-height: 1;">14</span><span style="font-size: 15px; color: {{t.sub}};">ready to review</span></span>

        isToday: id === 'today', isWatching: id === 'watching', isCards: id === 'cards', isTalk: id === 'talk',
        labelColor: labelOf(id),
        icon: info[id].icon,
        chip: chipOf(id),
        line: FUN[id],
        isHero: id === heroId && shown && open.length > 1,
        look: lookHere,
        isMini: isFloat, isWatchingTiled: id === 'watching' && !isFloat,
        canFloat: id === 'watching' && shown,
        floatLabel: isFloat ? 'Put back in the tiles' : 'Pop out as a small window',
        floatIcon: isFloat ? 'M4 5h16v14H4zM4 12h16' : 'M4 5h16v14H4zM12 12h6v5h-6z',
        toggleFloat: () => (isFloat ? openTile('watching') : this.setState({ float: true, open: open.filter((x) => x !== 'watching'), drag: null, over: null })),
        floatGrab: grabFloat,
        draggable: movable, cursor: isFloat ? (carry ? 'grabbing' : 'grab') : movable ? 'grab' : 'default',
        dragHint: isFloat ? 'Drag to move; it settles into a corner' : movable ? 'Drag to swap places' : '',
        style: `position: absolute; left: ${r.l}; top: ${r.t}; width: ${r.w}; height: ${r.h}; box-sizing: border-box; border-radius: 16px; ${tileOf(id)}${isFloat ? ' box-shadow: 0 24px 60px rgba(0,0,0,0.28), 0 2px 8px rgba(0,0,0,0.12);' : ''} z-index: ${isFloat ? 4 : 1}; display: flex; flex-direction: column; overflow: hidden; contain: layout paint;` +
          ` outline: ${target ? `2px dashed ${t.ink}` : '2px solid transparent'}; outline-offset: 3px;` +
          ` opacity: ${shown ? (drag === id ? 0.45 : 1) : 0}; transform: ${id === 'talk' ? (shown ? 'none' : 'scale(0.06)') : `scale(${shown ? 1 : 0.93})`};${id === 'talk' ? ` transform-origin: ${talkOrigin};` : ''} pointer-events: ${shown ? 'auto' : 'none'}; visibility: ${shown ? 'visible' : 'hidden'};` +
          (resizing || (isFloat && carry)
            ? ' transition: none;'
            : ` transition: left 0.38s ${ease}, top 0.38s ${ease}, width 0.38s ${ease}, height 0.38s ${ease}, opacity ${shown ? '0.18s' : '0.2s'} cubic-bezier(0.4, 0, 0.2, 1) ${id === 'talk' && !shown ? '0.08s' : '0s'}, transform ${id === 'talk' ? '0.42s' : '0.32s'} ${ease}, outline-color 0.2s, visibility 0s linear ${shown ? '0s' : '0.34s'};`),
        close: () => set(open.filter((x) => x !== id)),
        menu: (e) => {
          if (!shown) return;
          if (e && e.preventDefault) e.preventDefault();
          const root = e.currentTarget.closest('section').parentElement.parentElement.parentElement.parentElement;
          const rb = root.getBoundingClientRect();
          const scale = rb.width / root.offsetWidth || 1;
          this.setState({ menu: { id, x: (e.clientX - rb.left) / scale, y: (e.clientY - rb.top) / scale } });
        },
        promote: () => set(withTalk([id, ...others.filter((x) => x !== id)], open.includes('talk'))),
        dragStart: (e) => {
          if (e && e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', id); }
          this.setState({ drag: id });
        },
        dragOver: (e) => {
          if (!drag || id === 'talk' || !shown) return;
          if (e && e.preventDefault) e.preventDefault();
          if (over !== id) this.setState({ over: id });
        },
        drop: (e) => {
          if (e && e.preventDefault) e.preventDefault();
          if (drag && drag !== id && id !== 'talk') swap(drag, id);
          else this.setState({ drag: null, over: null });
        }
      };
    });
    const shelf = ['today', 'watching', 'cards']
      .filter((id) => !open.includes(id))
      .map((id) => ({ name: open.length >= 3 ? `Swap in ${info[id].name}` : `${info[id].name} beside`, peek: info[id].peek, hint: `Open ${info[id].name} beside  ${info[id].key}`, open: () => openTile(id) }));
    const deck = [
      { front: 'madrugar', back: 'to get up early', ex: 'Mañana tengo que madrugar.', from: 'Un día en Madrid · 1:25' },
      { front: 'sartén', back: 'frying pan', ex: 'Calienta el aceite en la sartén.', from: 'Tortilla española · 2:04' },
      { front: 'aprovechar', back: 'to make the most of', ex: 'Hay que aprovechar el día.', from: 'Un día en Madrid · 3:40' }
    ];
    const idx = st.idx ?? 0;
    const card = deck[idx % deck.length];
    const revealed = !!st.revealed;
    const talkOpen = open.includes('talk');
    const cardsOpen = open.includes('cards');
    const isRail = nav === 'rail';
    const isTop = nav === 'top';
    return {
      t, tiles, panes, shelf, dividers, noop: () => {},
      // A highlighter stroke across the lower part of the word, in the colour of its rung.
      wordMark: `linear-gradient(transparent 58%, ${dark ? 'rgba(255,214,10,0.30)' : 'rgba(255,205,40,0.55)'} 58%, ${dark ? 'rgba(255,214,10,0.30)' : 'rgba(255,205,40,0.55)'} 92%, transparent 92%)`,
      navTiles: tiles.filter((x) => !x.isDuet),
      fun: {
        show: fun ? 'block' : 'none',
        sun: FUN.today,
        leaf: FUN.cards,
        today: { line: FUN.today },
        watching: { line: FUN.watching },
        cards: { line: FUN.cards }
      },
      track: (e) => {
        // Point the eyes at the pointer: up to 2.5px across, 1.5px up or down.
        const root = e.currentTarget;
        const face = root.querySelector('.duet-face');
        if (!face) return;
        const b = face.getBoundingClientRect();
        const dx = e.clientX - (b.left + b.width / 2);
        const dy = e.clientY - (b.top + b.height / 2);
        const d = Math.hypot(dx, dy) || 1;
        const k = Math.min(1, d / 160);
        face.style.setProperty('--px', `${((dx / d) * 2.5 * k).toFixed(2)}px`);
        face.style.setProperty('--py', `${((dy / d) * 1.5 * k).toFixed(2)}px`);
      },
      untrack: (e) => {
        const face = e.currentTarget.querySelector('.duet-face');
        if (face) { face.style.setProperty('--px', '0px'); face.style.setProperty('--py', '0px'); }
      },
      duet: (() => {
        const on = open.includes('talk');
        // Something to say: a hello at first, and a thought after each card you finish.
        const says = !on && (st.says ?? true);
        const ease = 'cubic-bezier(0.22, 1, 0.36, 1)';
        return {
          toggle: tiles.find((x) => x.isDuet).toggle,
          activeText: on ? 'true' : 'false',
          on,
          faceShow: `display: grid; place-items: center; opacity: ${on ? 0 : 1}; transform: ${on ? 'scale(0.6) rotate(-12deg)' : 'none'};`,
          chatShow: `display: block; opacity: 1; transform: none;`,
          chatFill: dark ? '#0e0f0f' : '#f7f8f7',
          chatEdge: dark ? 'rgba(255,255,255,0.16)' : 'rgba(27,32,31,0.16)',
          chatInk: dark ? '#eef5f3' : '#18211f',
          // Light: a white square with ink eyes (the light icon); dark: an ink square with light eyes.
          face: `width: 36px; height: 36px; border-radius: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: ${dark ? '#0e0f0f' : '#f7f8f7'}; box-shadow: ${dark ? 'inset 0 0 0 1px rgba(255,255,255,0.10)' : 'inset 0 0 0 1px rgba(27,32,31,0.12), 0 1px 2px rgba(27,32,31,0.06)'};`,
          socket: `width: 13px; height: 10px; border-radius: 5px; background: ${dark ? '#eef5f3' : '#18211f'};`,
          pupil: `width: 5px; height: 2.5px; border-radius: 2px; color: ${dark ? '#0e0f0f' : '#f7f8f7'}; background: currentColor;`,
          react: st.react ? `react-${st.react}` : '',
          smile: `display: block; width: 6px; height: 2.5px; border-radius: 0 0 4px 4px; background: ${dark ? '#c6ddd9' : '#3a4644'};`,
          label: on ? 'Close the chat with Duet' : 'Talk to Duet',
          // Open: a soft ring and a short line under the icon, like a tab that's selected.
          ring: `position: absolute; left: 50%; bottom: -3px; width: ${on ? 14 : 0}px; height: 3px; border-radius: 2px; background: ${t.accent}; transform: translateX(-50%); transition: width 0.3s ${ease};`,
          // Closed with something to say: a small coral dot at the corner.
          dot: `position: absolute; right: 0px; top: 0px; width: 8px; height: 8px; border-radius: 4px; background: ${t.accent}; box-shadow: 0 0 0 2px ${t.ground.startsWith('#') ? t.ground : t.bg}; transform: scale(${on || !says ? 0 : 1}); transition: transform 0.28s ${ease};`
        };
      })(),
      grainClass: (theme === 'human' ? (dark ? 'grain-dark ' : 'grain-light ') : '') + (dark ? 'theme-dark' : 'theme-light'),
      lookAt: { today: () => this.setState({ look: 'today' }), watching: () => this.setState({ look: 'watching' }), cards: () => this.setState({ look: 'cards' }) },
      face: (() => {
        // Two of the icon's eyes, half over the top edge of the main tile, just left of its buttons.
        const heroBox = open.length === 0 ? hubRects.today : heroId ? rects[heroId] : null;
        const show = !!heroBox && !open.includes('talk') && theme === 'human';
        const hb = heroBox || full;
        const lookBox = st.look && (open.length === 0 ? hubRects[st.look] : rects[st.look]);
        const dx = !lookBox || st.look === heroId ? 0 : lookBox.l === '0px' ? -3 : 3;
        const dy = !lookBox || st.look === heroId ? 2 : lookBox.t === '0px' ? -1.5 : 2.5;
        const happy = !!st.happy;
        return {
          style: `position: absolute; left: calc(${hb.l} + ${hb.w} - 150px); top: calc(${hb.t} - 9px); z-index: 5; display: flex; gap: 5px; padding: 4px 6px; border-radius: 10px; background: ${t.ground.startsWith('#') ? t.ground : t.bg}; opacity: ${show ? 1 : 0}; transition: left 0.38s cubic-bezier(0.22, 1, 0.36, 1), top 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease; pointer-events: none;`,
          pupil: happy
            ? `display: block; width: 9px; height: 5px; border-radius: 5px 5px 0 0; background: transparent; border: 2px solid ${t.bg}; border-bottom: 0; transform: translateY(1px);`
            : `display: block; width: 8px; height: 4px; border-radius: 3px; background: ${t.bg}; border: 0 solid transparent; transform: translate(${dx}px, ${dy}px);`
        };
      })(),
      hub: { today: tileOf('today'), watching: tileOf('watching'), cards: tileOf('cards') },
      hubLabel: { today: labelOf('today'), watching: labelOf('watching'), cards: labelOf('cards') },
      toggleDark: () => this.setState({ dark: !dark }),
      openSettings: () => this.setState({ settings: !st.settings }),
      closeSettings: () => this.setState({ settings: false }),
      settingsOpenText: st.settings ? 'true' : 'false',
      settingsChip: st.settings ? t.card : 'transparent',
      settings: (() => {
        // A panel the height of the work area, sliding in from the right edge over a faint scrim;
        // it slides back out the same way.
        const on = !!st.settings;
        const move = 'cubic-bezier(0.05, 0.9, 0.1, 1.05)';
        return {
          hiddenText: on ? 'false' : 'true',
          scrim: `position: absolute; inset: 48px 0 0 0; z-index: 7; background: rgba(27,32,31,${on ? 0.06 : 0}); pointer-events: ${on ? 'auto' : 'none'}; transition: background 0.22s ease;`,
          panel: `position: absolute; top: 48px; right: 8px; bottom: 8px; width: 500px; z-index: 8; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; border-radius: 16px; background: ${t.card}; border: 1px solid ${dark ? 'rgba(238,243,241,0.08)' : 'rgba(27,32,31,0.09)'}; box-shadow: 0 24px 60px rgba(0,0,0,${dark ? 0.5 : 0.16}), 0 2px 8px rgba(0,0,0,${dark ? 0.3 : 0.06}); transform: translateX(${on ? '0' : 'calc(100% + 24px)'}); opacity: ${on ? 1 : 0}; visibility: ${on ? 'visible' : 'hidden'}; transition: transform 0.38s ${move}, opacity 0.2s ease, visibility 0s linear ${on ? '0s' : '0.38s'};`
        };
      })(),
      themeLabel: dark ? 'Light mode' : 'Dark mode',
      themeIcon: dark ? 'M12 4V2M12 22v-2M4.9 4.9 3.5 3.5M20.5 20.5l-1.4-1.4M4 12H2M22 12h-2M4.9 19.1l-1.4 1.4M20.5 3.5l-1.4 1.4M12 7a5 5 0 1 0 0 10a5 5 0 0 0 0-10z' : 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',
      ...(() => {
        // The tile menu (right-click a tile's header): layout, main, floating, close.
        const m = st.menu;
        if (!m) return { menuOpen: false, menuItems: [], menuStyle: '', menuTitle: '' };
        const id = m.id;
        const isFloat = id === 'watching' && floating;
        const done = (next) => () => this.setState({ menu: null, ...next });
        const item = (label, icon, keys, run, color) => ({ isItem: true, isRule: false, label, icon, keys, run, color: color || t.ink });
        const rule = { isItem: false, isRule: true };
        const items = [];
        if (!isFloat && id !== 'talk' && others.length === 2) {
          items.push(stacked
            ? item('Put side by side', 'M4 5h16v14H4zM12 5v14', 'Ctrl+Alt+S', done({ stacked: false }))
            : item('Stack top and bottom', 'M4 5h16v14H4zM4 12h16', 'Ctrl+Alt+S', done({ stacked: true })));
        }
        if (!isFloat && id !== 'talk' && others.indexOf(id) > 0) {
          items.push(item('Make main', 'M4 5h16v14H4zM10 5v14', 'Ctrl+Enter', () => this.setState({ menu: null, open: withTalk([id, ...others.filter((x) => x !== id)], open.includes('talk')) })));
        }
        if (id === 'watching') {
          items.push(isFloat
            ? item('Put back in the tiles', 'M4 5h16v14H4zM4 12h16', 'Ctrl+Alt+F', () => { this.setState({ menu: null }); openTile('watching'); })
            : item('Pop out as a small window', 'M4 5h16v14H4zM12 12h6v5h-6z', 'Ctrl+Alt+F', done({ float: true, open: open.filter((x) => x !== 'watching') })));
        }
        if (items.length) items.push(rule);
        items.push(item('Close', 'M6 6l12 12M18 6L6 18', 'Ctrl+W', isFloat ? done({ float: false }) : done({ open: open.filter((x) => x !== id) }), t.ink));
        const x = Math.min(m.x, 1120 - 236);
        const y = Math.min(m.y, 720 - 40 * items.length - 20);
        return {
          menuOpen: true,
          menuItems: items,
          menuTitle: `${info[id].name} options`,
          menuStyle: `position: absolute; left: ${x}px; top: ${y}px; z-index: 10; width: 228px; padding: 5px; border-radius: 12px; background: ${t.card}; border: 1px solid ${t.line}; box-shadow: 0 16px 40px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.08);`
        };
      })(),
      closeMenu: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ menu: null }); },
      dragEnd: () => this.setState({ drag: null, over: null }),
      homeActiveText: open.length === 0 ? 'true' : 'false',
      homeStyle: `border: 0; cursor: pointer; width: 36px; height: 28px; border-radius: 999px; display: grid; place-items: center; background: ${open.length === 0 ? t.card : 'transparent'}; box-shadow: ${open.length === 0 ? (dark ? 'inset 0 0 0 1px rgba(238,243,241,0.10)' : '0 1px 2px rgba(27,32,31,0.10), inset 0 0 0 1px rgba(27,32,31,0.06)') : 'none'}; color: ${open.length === 0 ? t.ink : t.sub}; transition: background 0.18s cubic-bezier(0.4, 0, 0.2, 1), color 0.18s cubic-bezier(0.4, 0, 0.2, 1);`,
      // The hub fades in as the tiles shrink back into it, and out as the clicked tile grows.
      hubHiddenText: open.length === 0 ? 'false' : 'true',
      hubStyle: `height: 100%; display: grid; gap: 8px; grid-template-columns: ${hc * 100}fr ${(1 - hc) * 100}fr; grid-template-rows: minmax(0, ${hr * 100}fr) minmax(0, ${(1 - hr) * 100}fr); opacity: ${open.length === 0 ? 1 : 0}; transform: scale(${open.length === 0 ? 1 : 0.985}); pointer-events: ${open.length === 0 ? 'auto' : 'none'}; visibility: ${open.length === 0 ? 'visible' : 'hidden'}; transition: opacity 0.24s cubic-bezier(0.4, 0, 0.2, 1) ${open.length === 0 ? '0.08s' : '0s'}, transform 0.38s ${ease}, visibility 0s linear ${open.length === 0 ? '0s' : '0.3s'};`,
      // Duet peeks up from the bottom edge while it's put away, and sinks out of sight as it opens.
      // While Duet is put away it keeps a strip of its own along the bottom, so it never covers a tile.
      areaBottom: '8px',
      peekHiddenText: talkOpen ? 'true' : 'false',
      peekWrapStyle: `position: absolute; right: 40px; bottom: ${talkOpen ? '-130px' : '-46px'}; opacity: ${talkOpen ? 0 : 1}; pointer-events: ${talkOpen ? 'none' : 'auto'}; z-index: 3; transition: bottom 0.38s ${ease}, opacity 0.3s ease;`,
      isRail, isTop, hasHeader: !isRail,
      mainPadLeft: isRail ? '0px' : '8px',
      isHub: open.length === 0, hasPanes: open.length > 0,
      showShelf: nav === 'shelf' && open.length > 0 && shelf.length > 0,
      home: () => set([]),
      openToday: () => openTile('today'), openWatching: () => openTile('watching'),
      openCards: () => openTile('cards'), openTalk: () => openTile('talk'),
      card, cardLeft: 14 - idx, revealed, notRevealed: !revealed,
      reveal: () => this.setState({ revealed: true }),
      rate: () => {
        // Duet is pleased for a moment when a card is done.
        this.setState({ revealed: false, idx: idx + 1 });
        react('happy', 1300);
        this.setState({ says: true });
      },
      talkClosed: !talkOpen,
      talkLine: cardsOpen ? `I see you're on “${card.front}”. Want to make a sentence with it?` : 'Hi! Want to try cocina in a sentence?',
      bubble: cardsOpen ? 'Stuck on a card? Tap me and I open beside it.' : open.length === 0 ? 'Five minutes today? Pick a tile, or tap me.' : 'I’m here if you need me.'
    };
  }
}
</script>
